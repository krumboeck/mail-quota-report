# mail-quota-report — client-seitige Minimal-Config für doveadm (BUILD-ZEIT).
#
# ZWECK: Registriert das quota-Subcommand im doveadm-Client. Ohne
# mail_plugins=quota antwortet doveadm "Fatal: Unknown command 'quota',
# but plugin quota exists. Try to set mail_plugins=quota" (Exit 75) —
# der Client lädt seine Plugins über die Config (doveadm(1)/quota-Plugin-
# Doku: "The quota get and quota recalc commands are only available when
# the global mail_plugins setting contains the quota plugin",
# doveadm-quota(1)).
#
# Das ist NICHT die Server-Config der Mail-Plattform! Der Report-Container
# nutzt doveadm ausschließlich als Client gegen den doveadm-Server
# (doveadm quota get -S <host>:<port> -u <mailbox>); Server-seitige
# Voraussetzungen (Listener + doveadm_password) stehen im README
# „Dovecot server setup“.
#
# Version-Header: Pflicht — ohne dovecot_storage_version stirbt doveconf
# mit Fatal (Exit 89); akzeptiert exakt 2.4.0/2.4.1/2.4.2/2.4.3/2.4.4
# (Debian trixie: dovecot-core 2.4.x). Beide Zeilen bewusst gesetzt.
dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0
mail_plugins = quota
